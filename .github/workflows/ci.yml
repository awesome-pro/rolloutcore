name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The state machine, the adapters and the replay validator are pure Python with
# no dependencies, so the whole matrix is cheap. GPU work (a real `vllm serve`
# plus NCCL) is not here: it needs a pod, and `diagnostics/` owns those runs.
env:
  PYTHONPATH: src:tests

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No `pip install` of the package: the tests run straight from the
      # source tree via PYTHONPATH, which keeps the no-dependency claim honest.
      - name: unittest
        run: python -m unittest discover -s tests -t tests -v
      - name: pytest
        run: |
          python -m pip install --quiet pytest
          python -m pytest

  demo:
    name: fake-engine cycle demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run demo
        run: python -m rolloutcore.demo

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet ruff
      - run: ruff check src tests scripts diagnostics
      - run: ruff format --check src tests scripts diagnostics

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet mypy
      - run: mypy
